spring.application.name=veterinaria-api
server.port=8080
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/veterinaria?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.jpa.open-in-view=false
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
app.jwt.secret=${JWT_SECRET:local-development-secret-key-change-before-deploying-2026}
app.jwt.ttl-hours=${JWT_TTL_HOURS:12}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173}
springdoc.swagger-ui.path=/swagger-ui.html
