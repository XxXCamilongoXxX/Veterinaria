<!-- registro.html -->
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registro - Vet San Marcos</title>
<link rel="stylesheet" href="css/estilos.css">
</head>
<body>

<header class="header-vet">
  <div class="nav-bar">
    <a href="index.html" class="logo">Vet San Marcos</a>
    <nav>
      <ul class="menu">
        <li><a href="index.html">Inicio</a></li>
        <li><a href="servicios.html">Servicios</a></li>
        <li><a href="login.html">Ingresar</a></li>
        <li><a href="registro.html">Registro</a></li>
      </ul>
    </nav>
  </div>
</header>

<main>
  <section class="banner-principal" style="display: block; max-width: 500px;">
    <h1 style="color: #2e86c1;">Crear cuenta nueva</h1>
    <p>Únete para pedir horas sin tener que llamar a la recepcionista de la clínica.</p>
    
    <form id="form-reg" style="display: flex; flex-direction: column; gap: 15px;">
      <label>Tu nombre:</label>
      <input type="text" id="nom-reg" style="padding: 10px;" placeholder="Juan Pérez">
      
      <label>Correo:</label>
      <input type="text" id="mail-reg" style="padding: 10px;" placeholder="juan@correo.com">
      
      <label>Contraseña:</label>
      <input type="password" id="pass1" style="padding: 10px;">
      
      <label>Repetir contraseña:</label>
      <input type="password" id="pass2" style="padding: 10px;">
      
      <button type="button" class="boton-verde" onclick="validarRegistro()">Registrarme</button>
      <p id="error-reg" style="color: red; font-weight: bold;"></p>
    </form>
  </section>
</main>

<footer class="footer-decorado">
  <p>Veterinaria San Marcos 2026 - Proyecto de evaluación</p>
  <p>Hecho por alumnos</p>
</footer>

<script>
  function validarRegistro() {
    var nom = document.getElementById('nom-reg').value;
    var mail = document.getElementById('mail-reg').value;
    var p1 = document.getElementById('pass1').value;
    var p2 = document.getElementById('pass2').value;
    var error = document.getElementById('error-reg');
    
    if(nom == "" || mail == "" || p1 == "" || p2 == "") {
      error.style.color = "red";
      error.innerText = "Tienes que llenar todo, por favor";
      return;
    }
    
    if(!mail.includes("@")) {
      error.style.color = "red";
      error.innerText = "El correo no sirve así";
      return;
    }
    
    if(p1 != p2) {
      error.style.color = "red";
      error.innerText = "Las contraseñas no coinciden";
      return;
    }
    
    error.style.color = "green";
    error.innerText = "¡Cuenta creada correctamente!";
  }
</script>

</body>
</html>
