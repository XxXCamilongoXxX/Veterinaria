<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registro - Vet San Marcos</title>
<link rel="stylesheet" href="css/estilos.css">
</head>
<body>

<header class="header-vet">
  <div class="nav-bar">
    <a href="index.html" class="logo">Vet San Marcos</a>
    <nav>
      <ul class="menu">
        <li><a href="index.html">Inicio</a></li>
        <li><a href="servicios.html">Servicios</a></li>
        <li><a href="login.html">Ingresar</a></li>
        <li><a href="registro.html">Registro</a></li>
      </ul>
    </nav>
  </div>
</header>

<main>
  <section class="contenedor-formulario">
    <h1 class="titulo-azul">Crear cuenta nueva</h1>
    <p>Únete para pedir horas sin tener que llamar a la clínica.</p>
    
    <form id="form-registro" class="formulario">
      <div class="grupo-form">
        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" placeholder="Ej: Juan">
        <span id="nombre-error" class="msj-error"></span>
      </div>

      <div class="grupo-form">
        <label for="apellido">Apellido:</label>
        <input type="text" id="apellido" placeholder="Ej: Pérez">
        <span id="apellido-error" class="msj-error"></span>
      </div>
      
      <div class="grupo-form">
        <label for="correo-registro">Correo:</label>
        <input type="text" id="correo-registro" placeholder="juan@correo.com">
        <span id="correo-registro-error" class="msj-error"></span>
      </div>
      
      <div class="grupo-form">
        <label for="clave-registro">Contraseña:</label>
        <input type="password" id="clave-registro" placeholder="Mínimo 8 caracteres">
        <span id="clave-registro-error" class="msj-error"></span>
      </div>
      
      <div class="grupo-form">
        <label for="clave-confirmar">Repetir contraseña:</label>
        <input type="password" id="clave-confirmar" placeholder="Repite tu contraseña">
        <span id="clave-confirmar-error" class="msj-error"></span>
      </div>

      <div class="grupo-form">
        <label for="fecha-nacimiento">Fecha de nacimiento:</label>
        <input type="date" id="fecha-nacimiento">
        <span id="fecha-nacimiento-error" class="msj-error"></span>
      </div>

      <div class="grupo-form">
        <label for="telefono">Teléfono:</label>
        <input type="text" id="telefono" placeholder="Ej: 987654321">
        <span id="telefono-error" class="msj-error"></span>
      </div>
      
      <button type="submit" class="boton-verde">Registrarme</button>
      <p id="mensaje-formulario"></p>

      <div class="enlaces-form">
        <p>¿Ya tienes cuenta? <a href="login.html">Inicia sesión aquí</a></p>
        <p><a href="index.html">Volver a la página principal</a></p>
      </div>
    </form>
  </section>
</main>

<footer class="footer-decorado">
  <p>Veterinaria San Marcos <span id="anio-actual"></span> - Proyecto de evaluación</p>
  <p>Hecho por alumnos</p>
</footer>

<script src="js/script.js"></script>
</body>
</html>
