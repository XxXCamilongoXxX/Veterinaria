<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Detalle Servicio - Vet San Marcos</title>
<link rel="stylesheet" href="css/estilos.css">
</head>
<body>

<header class="header-vet">
  <div class="nav-bar">
    <a href="index.html" class="logo">Vet San Marcos</a>
    <nav>
      <ul class="menu">
        <li><a href="index.html">Inicio</a></li>
        <li><a href="servicios.html">Servicios</a></li>
        <li><a href="login.html">Ingresar</a></li>
        <li><a href="registro.html">Registro</a></li>
      </ul>
    </nav>
  </div>
</header>

<main>
  <section class="contenedor-formulario" style="max-width: 700px; display: flex; gap: 30px; align-items: flex-start;">
    
    <img src="img/gato%20vacuna.jpg" alt="gato vacunándose" width="300" style="border-radius: 10px;">
    
    <div style="flex: 1;">
      <h1 class="titulo-azul">Agendar: Vacunación</h1>
      <p>Protege a tu mascota. El valor depende del animal; elige abajo para ver el presupuesto y seleccionar una fecha.</p>
      
      <form id="form-reserva" class="formulario">
        <div class="grupo-form">
          <label for="tipo-animal">Selecciona tu mascota:</label>
          <select id="tipo-animal" style="padding: 10px; border-radius: 5px; border: 1px solid #ccc;">
            <option value="0">Elige una opción...</option>
            <option value="15000">Perro - $15.000</option>
            <option value="12000">Gato - $12.000</option>
            <option value="10000">Conejo/Ave - $10.000</option>
          </select>
        </div>

        <div class="grupo-form">
          <label for="fecha-reserva">Día de la cita:</label>
          <input type="date" id="fecha-reserva">
        </div>
        
        <p style="font-size: 20px; font-weight: bold; margin-top: 15px;">Total a pagar: <span id="precio-final" style="color: #28b463;">$0</span></p>
        
        <button type="button" id="btn-agendar" class="boton-verde">Agendar hora</button>
        <p id="mensaje-reserva" style="margin-top: 15px; font-weight: bold; line-height: 1.5;"></p>
      </form>
    </div>
  </section>
</main>

<footer class="footer-decorado">
  <p>Veterinaria San Marcos <span id="anio-actual"></span> - Proyecto de evaluación</p>
  <p>Hecho por alumnos</p>
</footer>

<script src="js/script.js"></script>
</body>
</html>
