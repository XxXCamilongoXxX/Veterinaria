<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Vet San Marcos</title>
<link rel="stylesheet" href="css/estilos.css">
</head>
<body>

<header class="header-vet">
  <div class="nav-bar">
    <a href="index.html" class="logo">Vet San Marcos</a>
    <nav>
      <ul class="menu">
        <li><a href="index.html">Inicio</a></li>
        <li><a href="servicios.html">Servicios</a></li>
        <li><a href="login.html">Ingresar</a></li>
        <li><a href="registro.html">Registro</a></li>
      </ul>
    </nav>
  </div>
</header>

<main>
  <section class="contenedor-formulario">
    <h1 class="titulo-azul">Iniciar Sesión</h1>
    <p>Ingresa para ver las fichas de tus animales en línea.</p>
    
    <!-- Conectado al script.js con id="form-login" -->
    <form id="form-login" class="formulario">
      <div class="grupo-form">
        <label for="correo-login">Correo:</label>
        <input type="text" id="correo-login" placeholder="tu@correo.com">
        <span id="correo-login-error" class="msj-error"></span>
      </div>
      
      <div class="grupo-form">
        <label for="clave-login">Contraseña:</label>
        <input type="password" id="clave-login" placeholder="tu clave">
        <span id="clave-login-error" class="msj-error"></span>
      </div>
      
      <!-- Ya no usamos onclick, el script.js escucha el evento submit del formulario -->
      <button type="submit" class="boton-verde">Entrar a mi cuenta</button>
      <p id="mensaje-formulario"></p>
      
      <!-- Enlaces requeridos por la pauta -->
      <div class="enlaces-form">
        <p>¿No tienes cuenta? <a href="registro.html">Regístrate aquí</a></p>
        <p><a href="index.html">Volver a la página principal</a></p>
      </div>
    </form>
  </section>
</main>

<footer class="footer-decorado">
  <p>Veterinaria San Marcos <span id="anio-actual"></span> - Proyecto de evaluación</p>
  <p>Hecho por alumnos</p>
</footer>

<!-- Enlazamos tu script externo -->
<script src="js/script.js"></script>
</body>
</html>
